{% extends 'portal/base.html' %}

{% block title %}특별상 페이지{% endblock %}

{% block content %}
<section class="success-hero bonus-prize-hero" aria-labelledby="bonus-prize-title">
  <div class="bonus-prize-shell">
    <div class="bonus-prize-copy">
      <p class="eyebrow">Bonus Prize</p>
      <h1 id="bonus-prize-title">특별상 페이지</h1>
      <p class="bonus-prize-lede">특별상은 딱 1명에게만 지급됩니다. 운영자에게 이 화면과 아래 코드를 보여주세요.</p>
    </div>

    <div class="bonus-prize-board" aria-label="특별상 확인 정보">
      <div class="bonus-prize-count">
        <span>1</span>
        <strong>딱 1명</strong>
      </div>

      <div class="bonus-prize-detail">
        <p class="eyebrow">Final Code</p>
        <h2>특별상 최종 확인</h2>
        <p>보너스 문제 검증을 통과했습니다. 아래 코드를 운영자 확인용으로 사용하세요.</p>
        <pre class="flag-box bonus-flag-box">{{ bonus_flag }}</pre>
      </div>
    </div>

    <div class="success-actions">
      <a class="primary-action" href="/">학과홈으로 돌아가기</a>
      <a class="secondary-action" href="/flags/">제출 페이지</a>
    </div>
  </div>
</section>
{% endblock %}
